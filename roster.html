<script>
const RATS = [{"n":"Beethowen","e":"Dark","r":"Bard","s":3,"t":"The Stormy Maestro","b":"A brooding genius who conducts every battle like a thunderous symphony. He scowls, he swings his baton, and somehow the whole party plays louder and hits harder with every bar.","img":"img/beethowen.webp","k":[["Movement","Basic attacks build a stacking party-wide damage buff."],["Ode to Joy","The buff no longer decays as quickly between waves."],["Symphony No. 9","At maximum stacks, the buff also grants bonus attack speed."]],"a":"All Dark allies gain increased attack speed."},{"n":"Blackwhisker","e":"Water","r":"Bard","s":3,"t":"The Dockside Crooner","b":"He runs the smokiest speakeasy on the harbourfront and plays a mean saxophone. Between solos he quietly lifts the armour right off his rivals and hands it to his crew.","img":"img/blackwhisker.webp","k":[["Plunder","Blackwhisker steals a small amount of the target's armor on hit, for a few seconds."],["First Mate","Stolen armor is also granted to a random ally."],["Dread","Enemies with stolen armor deal reduced damage."]],"a":"All Water allies gain increased hit chance."},{"n":"Boulder","e":"Earth","r":"Bard","s":1,"t":"The Mossy Gentle Giant","b":"Boulder has stood in one spot so long that moss grows on his shoulders. Slow, sleepy and impossible to move, he keeps the beat on his log drum and just keeps healing.","img":"img/boulder.webp","k":[["Rooted","Boulder's movement speed is reduced, but his HP is increased."],["Deep Roots","Boulder regenerates a small amount of HP each second."],["Bedrock","Boulder's HP regeneration increases while he hasn't moved recently."]],"a":"All Earth allies gain increased armor."},{"n":"Burrow","e":"Earth","r":"Guardian","s":2,"t":"The Old Coal Miner","b":"Forty years underground taught Burrow one thing: once you dig in, you don't budge. His shovel blocks the hits and his armour only gets thicker the longer he holds his ground.","img":"img/burrow.webp?v=2","k":[["Dig In","Burrow's armor is increased while stationary."],["Underground","Burrow takes slightly reduced damage from the first hit each wave."],["Deep Den","Armor bonus while stationary increases further."]],"a":"All Earth allies gain increased armor."},{"n":"Cinder","e":"Fire","r":"Ranger","s":1,"t":"The Smouldering Sharpshooter","b":"Goggles up, slingshot loaded, tail smoking. Cinder is a hot-headed junkyard kid with flame-coloured hair and a shot that always lands where it hurts.","img":"img/cinder.webp","k":[["Hot Shot","Basic attacks deal bonus damage to enemies below 50% HP."],["Ashes to Ashes","Killing an enemy grants a burst of attack speed for a few seconds."],["Scorched Earth","Bonus damage against low-HP enemies increases further."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Cleorattra","e":"Light","r":"Bard","s":4,"t":"Queen of the Nile","b":"Glamorous, clever and fiercely protective of her court. A wave of her royal fan wraps the weakest ally in a shimmering shield of sunlight.","img":"img/cleorattra.webp?v=2","k":[["Extravagance","Periodically grants a shield to the ally with the lowest HP."],["Let Them Have Cake","The shield also grants a small heal when it's applied."],["Revolution","Shield strength increases the lower the target's HP was."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Cobble","e":"Earth","r":"Artillerist","s":1,"t":"The Living Cobblestone","b":"A hulking heap of street cobbles that woke up one day and decided to fight. When it hurls its rubble, the stones scatter into the next enemy in line.","img":"img/cobble.webp?v=2","k":[["Scatter Shot","Basic attacks have a chance to hit a second nearby enemy for reduced damage."],["Rubble","The secondary hit chance increases slightly."],["Avalanche","Killing an enemy with the secondary hit refunds a portion of attack cooldown."]],"a":"All Earth allies gain increased armor."},{"n":"Confuscheese","e":"Light","r":"Ranger","s":3,"t":"The Wise Archer","b":"A calm old teacher who believes a steady mind makes a steady aim. His quiet wisdom helps the whole party find their mark.","img":"img/confuscheese.webp","k":[["Wisdom Shared","Periodically grants the party a small increase to hit chance."],["Golden Rule","Whenever an ally evades an attack, Confuscheese heals them slightly."],["Analects","The hit chance buff's strength increases."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Dawn","e":"Light","r":"Ranger","s":2,"t":"The Dawn Patrol Ace","b":"She takes off at first light and never misses her first shot. Every wave starts with a sunburst flare straight to the target.","img":"img/dawn.webp","k":[["First Light","Dawn's first attack each wave always critically hits."],["Rising Sun","Dawn's critical hit chance increases the longer a wave goes on."],["Daybreak","Critical hits have a chance to reset First Light, letting it guarantee another crit again before the wave ends."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Edgar Allan Paw","e":"Dark","r":"Ranger","s":5,"t":"The Gloomy Poet","b":"A melancholy marksman with a raven on his shoulder and a crossbow shaped like black wings. Once a foe is wounded, nevermore will it escape.","img":"img/edgar_allan_paw.webp","k":[["Nevermore","Basic attacks against enemies below 30% HP have a chance to execute them outright."],["Tell-Tale","The execute threshold increases slightly."],["Raven","Successful executes grant a burst of attack speed."]],"a":"All Dark allies gain increased attack speed."},{"n":"Ember","e":"Fire","r":"Artillerist","s":1,"t":"The Chimney Sweep","b":"A soot-covered rooftop sweep who knows every chimney in the city. She lobs glowing embers from an old clay chimney pot, and the fire spreads from one enemy to the next.","img":"img/ember.webp","k":[["Kindle","Basic attacks have a chance to ignite the target, dealing damage over time."],["Spreading Flame","Ignite has a chance to jump to a nearby enemy when it expires."],["Firestorm","Ignited enemies take increased damage from all sources."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Fidget","e":"Water","r":"Artillerist","s":2,"t":"The Restless Beach Kid","b":"Fidget physically cannot sit still. She bounces, twitches and hurls water balloons so fast she sometimes throws two at once.","img":"img/fidget.webp","k":[["Restless","Basic attacks have a small chance to hit twice."],["Can't Sit Still","Attack speed is slightly increased."],["Overactive","Double-hit chance increases further."]],"a":"All Water allies gain increased hit chance."},{"n":"Frost","e":"Water","r":"Artillerist","s":1,"t":"The Snow-Day Champion","b":"Bundled up and full of mischief, Frost has never lost a snowball fight. Her ladle catapult lobs ice balls that slow enemies down until they freeze solid.","img":"img/frost.webp","k":[["Chill Blast","Basic attacks have a chance to reduce the target's attack speed."],["Deep Freeze","Enemies with reduced attack speed that are hit again have a chance to be frozen briefly."],["Shatter","Frost deals bonus damage to frozen enemies."]],"a":"All Water allies gain increased hit chance."},{"n":"Genghis Fang","e":"Light","r":"Guardian","s":2,"t":"The Steppe Warlord","b":"A proud warlord who fights for his horde. The more of his friends still standing beside him, the harder he hits.","img":"img/genghis_fang.webp","k":[["Horde","Genghis Fang's damage increases for each living ally on the field."],["Conqueror","Killing an enemy grants a temporary armor bonus."],["Vast Empire","The damage bonus per living ally increases further."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Gnasher","e":"Fire","r":"Guardian","s":2,"t":"The Golden Grin","b":"A hooded brawler with a mouth full of solid gold teeth. He flashes that grin to taunt the nearest enemy into attacking him, then shrugs off the hits.","img":"img/gnasher.webp?v=2","k":[["Bright Guard","Taunts the nearest enemy at the start of each wave, forcing it to attack Gnasher."],["Burning Resolve","While taunting, Gnasher takes reduced damage from the taunted enemy."],["Flashpoint","When the taunted enemy dies, Gnasher heals for a portion of his max HP."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Halo","e":"Light","r":"Ranger","s":1,"t":"The Junkyard Angel","b":"A hopeful little rat with cardboard wings and a coat-hanger halo. Her spoon bow fires star-tipped arrows that sometimes heal her friends instead.","img":"img/halo.webp","k":[["Guiding Light","Basic attacks have a chance to heal the lowest-HP ally."],["Radiant Cure","Healing an ally also removes one negative effect from them."],["Last Light","Once per wave, prevents an ally's death and heals them instead."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Isaac Gnewton","e":"Earth","r":"Artillerist","s":5,"t":"The Gravity Genius","b":"A brilliant natural philosopher who discovered that apples fall, then built a cannon to make them fall on enemies. His shots pull foes together for a bigger crunch.","img":"img/isaac_gnewton.webp","k":[["Gravity Well","Basic attacks have a chance to pull nearby enemies slightly closer together."],["Reaction","Enemies pulled together take bonus damage from the next hit."],["Principia","The pull radius and chance both increase."]],"a":"All Earth allies gain increased armor."},{"n":"Leif Whiskerson","e":"Water","r":"Ranger","s":4,"t":"The Viking Navigator","b":"A seasoned explorer who has charted every far-off shore. His harpoon crossbow always finds the furthest enemy, and the first hit on a new target lands extra hard.","img":"img/leif_whiskerson.webp","k":[["Uncharted","Leif's attack range and hit chance are both increased against the furthest enemy."],["Landfall","The first attack against a new furthest target deals bonus damage."],["Discovery","Landfall's bonus damage increases further."]],"a":"All Water allies gain increased hit chance."},{"n":"Loam","e":"Earth","r":"Ranger","s":2,"t":"The Farmhand","b":"A big, steady farm woman who won't be pushed around by anything. Try to knock her back and her potato cannon answers with a rockslide.","img":"img/loam.webp","k":[["Heavy Frame","Loam has a chance to resist knockback and stun effects."],["Rockslide","Whenever Loam resists a control effect, nearby enemies take damage."],["Landslide","Loam's resistance chance increases further."]],"a":"All Earth allies gain increased armor."},{"n":"Lumen","e":"Light","r":"Bard","s":1,"t":"The Night-Light Kid","b":"A sleepy little guardian in pyjamas who keeps the dark away. When he rings his bell, a warm glow shields whoever needs it most.","img":"img/lumen.webp","k":[["Warm Glow","Periodically shields the ally with the lowest HP."],["Bright Ward","Shielded allies deal slightly increased damage while the shield holds."],["Overflow","Unused shield value converts into a heal when it expires."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Marie Antoinettail","e":"Fire","r":"Bard","s":5,"t":"The Rococo Queen","b":"Extravagant, pampered and used to getting her way. Her royal decrees fire up her allies, and her hair holds a cheesecake at all times.","img":"img/marie_antoinettail.webp","k":[["Royal Decree","Grants a random ally increased damage for a few seconds."],["Proclamation","Royal Decree can now affect two allies at once."],["Golden Age","Allies affected by Royal Decree also take reduced damage."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Mona Ratsa","e":"Dark","r":"Guardian","s":3,"t":"The Enigmatic Lady","b":"Nobody knows what she's thinking behind that smile. Her misty haze helps nearby allies slip out of harm's way.","img":"img/mona_ratsa.webp","k":[["Sfumato","Nearby allies have a small chance to evade attacks."],["Timeless","Mona Ratsa's evade-granting aura also slowly heals affected allies."],["Masterwork","The evade chance granted to allies increases further."]],"a":"All Dark allies gain increased attack speed."},{"n":"Nibbles","e":"Earth","r":"Ranger","s":3,"t":"The Snack Fiend","b":"Nibbles never stops eating. He goes after the weakest enemy first, and every knockout earns him a snack and a burst of speed.","img":"img/nibbles.webp?v=2","k":[["Quick Bite","Basic attacks deal bonus damage to the lowest-HP enemy."],["Snack Time","Gains a small burst of attack speed after every kill."],["Second Helping","Bonus damage against low-HP enemies increases further."]],"a":"All Earth allies gain increased armor."},{"n":"Onyx","e":"Dark","r":"Guardian","s":1,"t":"The Junk Knight","b":"A stubborn street kid who made himself a knight from a cooking pot and a frying pan. Hit him hard and he hits right back.","img":"img/onyx.webp","k":[["Hardened Shell","Onyx takes reduced damage from critical hits."],["Parry","Whenever Onyx is critically hit, he parries with a strike of his own for bonus damage."],["Immovable","Onyx's critical damage reduction increases further."]],"a":"All Dark allies gain increased attack speed."},{"n":"Pipsqueak","e":"Light","r":"Guardian","s":3,"t":"The Original Rat","b":"Your very first recruit and the one who never leaves. Tough, loyal and a little rough around the edges, Pipsqueak guards his friends and refuses to go down.","img":"img/pipsqueak.webp","k":[["Steadfast","Pipsqueak's basic attacks have a chance to reduce the target's attack speed briefly."],["Never Alone","Whenever an ally is below 30% HP, Pipsqueak's armor is increased for a few seconds."],["Old Friend","Once per wave, Pipsqueak can survive lethal damage with 1 HP instead of dying."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Ratana","e":"Water","r":"Artillerist","s":3,"t":"The Twin-Barrel Gunner","b":"A disciplined samurai-era gunner who always strikes twice. Her twin hand cannon can fire both barrels in a single breath.","img":"img/ratana.webp","k":[["Twin Blades","Basic attacks have a chance to hit twice in quick succession."],["Precision","The second hit's chance to land increases."],["Flurry","Both hits deal slightly increased damage."]],"a":"All Water allies gain increased hit chance."},{"n":"Ratankhamun","e":"Water","r":"Guardian","s":5,"t":"The Boy Pharaoh","b":"Eternal guardian of the tomb. Every ally who falls only hardens his resolve, and his armour grows with each one.","img":"img/ratankhamun.webp","k":[["Tomb Guard","Ratankhamun's armor increases for each ally that has died this wave."],["Sealed Chamber","While at high armor, incoming critical hits are converted to normal hits."],["Eternal Rest","The armor bonus per fallen ally increases further."]],"a":"All Water allies gain increased hit chance."},{"n":"Ratbert","e":"Fire","r":"Artillerist","s":3,"t":"The Mad Inventor","b":"Wild hair, scorched lab coat, endless experiments. His Tesla cannon's sparks leap from one enemy to the next.","img":"img/ratbert.webp","k":[["Spark","Basic attacks have a chance to chain to a second nearby enemy."],["Invention","Chained hits have a chance to briefly stun their target."],["Eureka","The chain can now jump to a third enemy."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Ratchelangelo","e":"Light","r":"Artillerist","s":5,"t":"The Master Sculptor","b":"Covered in marble dust and driven by perfection. His marble mortar splashes glowing fresco plaster that keeps burning enemies long after it lands.","img":"img/ratchelangelo.webp","k":[["Fresco","Basic attacks have a chance to leave a lingering AoE zone that deals damage over time."],["Studio","Standing in his own zone grants bonus attack speed."],["Masterstroke","Zones expand in size each time they land a killing blow."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Ratchet","e":"Earth","r":"Artillerist","s":4,"t":"The Wind-Up Mechanic","b":"A gruff tinkerer with a clockwork mortar on his shoulder. Every shot cranks the spring tighter, so each blast hits harder than the last.","img":"img/ratchet.webp","k":[["Wind Up","Each basic attack deals slightly more damage than the last, resetting after a miss."],["Tighten","The maximum number of stacks increases."],["Full Torque","At maximum stacks, the next attack deals bonus area damage."]],"a":"All Earth allies gain increased armor."},{"n":"Ratcrates","e":"Dark","r":"Bard","s":2,"t":"The Street Philosopher","b":"A scruffy old rat who wanders barefoot asking annoying questions. By the time he's done, enemies doubt themselves and hit softer.","img":"img/ratcrates.webp","k":[["Questioning","Basic attacks have a chance to reduce the target's damage for a few seconds."],["Known Unknowns","Debuffed enemies are revealed, increasing the party's hit chance against them."],["Wisdom","The damage-reduction debuff's duration is extended."]],"a":"All Dark allies gain increased attack speed."},{"n":"Ratcula","e":"Dark","r":"Guardian","s":5,"t":"The Vampire Count","b":"A fanged count of the night with wings like a giant bat. Every blow he lands drains a little life back into him.","img":"img/ratcula.webp?v=2","k":[["Crimson Thirst","Basic attacks heal Ratcula for a portion of the damage dealt."],["Bloodlust","Killing an enemy grants a stacking damage buff."],["Undying Thirst","While below a health threshold, lifesteal is dramatically increased."]],"a":"All Dark allies gain increased attack speed."},{"n":"Ratcules","e":"Earth","r":"Guardian","s":4,"t":"The Mighty Hero","b":"Boastful, cheerful and absurdly strong under his lion-pelt hood. His rousing rhythm pumps up the whole party's speed.","img":"img/ratcules.webp","k":[["Crescendo","Basic attacks build a stacking buff that increases the party's attack speed."],["Encore","The buff no longer decays between waves as quickly."],["Symphony","At maximum stacks, the buff also grants bonus damage."]],"a":"All Earth allies gain increased armor."},{"n":"Ratero","e":"Fire","r":"Artillerist","s":2,"t":"The Fiddling Emperor","b":"A pampered little emperor who thinks he's the greatest musician alive. When he plays, the whole battlefield catches fire.","img":"img/ratero.webp","k":[["Burn It Down","Basic attacks have a chance to ignite the whole area around the target."],["Fiddle While It Burns","Ratero's attack speed increases while any enemy is ignited."],["Great Fire","Ignite damage increases further."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Ratgellan","e":"Water","r":"Ranger","s":4,"t":"The Round-the-World Captain","b":"A dashing explorer who has sailed every sea. His musket always hunts the furthest enemy on the field.","img":"img/ratgellan.webp","k":[["Circumnavigate","Attack range is increased and attacks always target the furthest enemy."],["Uncharted Waters","The first attack on a newly-targeted enemy deals bonus damage."],["Around the World","Bonus damage against newly-targeted enemies increases further."]],"a":"All Water allies gain increased hit chance."},{"n":"Ratileo","e":"Dark","r":"Artillerist","s":2,"t":"The Rebel Stargazer","b":"A defiant astronomer who sees what others refuse to. His telescope fires comets that mark enemies so the whole team hits harder.","img":"img/ratileo.webp","k":[["Stargazer","Basic attacks against enemies have a chance to reveal and mark them for bonus damage."],["Observation","Marked enemies take increased damage from all party members."],["Heresy","Ratileo's own damage against marked enemies increases further."]],"a":"All Dark allies gain increased attack speed."},{"n":"Ratjamin Franklin","e":"Water","r":"Bard","s":5,"t":"The Inventor Statesman","b":"A jolly grandfather of invention with a kite always overhead. The music of his glass armonica heals and shields his friends.","img":"img/ratjamin_franklin.webp","k":[["Office Hours","Periodically grants a small heal to a random ally."],["Overtime","The heal amount is increased."],["Promotion","Healing an ally also grants them a brief shield."]],"a":"All Water allies gain increased hit chance."},{"n":"Ratmses II","e":"Light","r":"Guardian","s":4,"t":"The Sun King","b":"A towering warrior-pharaoh, as enduring as his own stone monuments. Huge health, steady regeneration and a shield like the sun itself.","img":"img/ratmses_ii.webp","k":[["Monument","Ratmses' max HP is increased."],["Pharaoh's Will","Ratmses regenerates a small amount of HP each second."],["Colossus","HP regeneration increases while above 50% HP."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Ratoleon Bones","e":"Dark","r":"Ranger","s":4,"t":"The Little Emperor","b":"Short in size, enormous in confidence. He marks targets for conquest and gets tougher with every enemy that falls.","img":"img/ratoleon_bones.webp","k":[["Mark for Conquest","Basic attacks mark the target, increasing damage it takes from the party."],["Old Guard","Gains a stacking damage reduction buff each time an enemy dies."],["Empire","While any enemy is marked, Ratoleon's attack speed is increased."]],"a":"All Dark allies gain increased attack speed."},{"n":"Ratputin","e":"Dark","r":"Bard","s":4,"t":"The Mystic","b":"A wild-bearded wanderer with an unsettling stare. Enemies near him miss their swings, and he simply refuses to die.","img":"img/ratputin.webp?v=2","k":[["Unnerving Presence","Enemies near Ratputin have a small chance to have their attack missed."],["Hard to Kill","Ratputin has a chance to survive lethal damage with 1 HP, once per wave."],["Resilience","After surviving lethal damage, Ratputin heals a portion of his max HP over a few seconds."]],"a":"All Dark allies gain increased attack speed."},{"n":"Ratry the Eighth","e":"Fire","r":"Ranger","s":5,"t":"The Tudor King","b":"Loud, jolly and furious all at once. He demands that every enemy look at HIM, and grows tougher while they try.","img":"img/ratry_the_eighth.webp","k":[["Royal Summons","Ratry taunts a random enemy every few seconds."],["Ironclad","While taunting, Ratry's armor is increased."],["Reign","Taunted enemies deal reduced damage."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Ratspeare","e":"Light","r":"Bard","s":2,"t":"The Playwright","b":"A dramatic poet who treats every battle as opening night. His soliloquies grant the party a random buff, comedy or tragedy.","img":"img/ratspeare.webp","k":[["Soliloquy","Periodically grants a random buff (attack speed, damage, or crit chance) to the whole party."],["Tragedy or Comedy","The buff granted is now always the one the party currently needs least of, for variety."],["All the World's a Stage","Buffs granted last longer."]],"a":"All Light allies take reduced damage while below 50% HP."},{"n":"Ratticus Aurelius","e":"Earth","r":"Bard","s":5,"t":"The Philosopher Emperor","b":"Calm, stoic and steady as stone. His meditations raise stone shields around the whole party.","img":"img/ratticus_aurelius.webp","k":[["Meditations","Periodically grants the party a small shield."],["Stoicism","Shielded allies take slightly reduced damage from control effects."],["Philosopher King","Shield strength increases further."]],"a":"All Earth allies gain increased armor."},{"n":"Rattlesnout","e":"Fire","r":"Ranger","s":3,"t":"The Desert Gunslinger","b":"Cool as the desert night, she gives one warning shot and no second chances. Her shots weaken the enemy before she strikes.","img":"img/rattlesnout.webp","k":[["Warning Shot","Basic attacks have a chance to reduce the target's damage briefly."],["Coiled","Rattlesnout's first attack each wave always applies the debuff."],["Strike","Debuffed targets take bonus damage from Rattlesnout."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Ratzarre","e":"Fire","r":"Bard","s":4,"t":"The Roman General","b":"An ambitious commander who rallies his legion with a blast of his war horn. Every enemy he defeats makes him stronger.","img":"img/ratzarre.webp","k":[["Twelve Labors","Ratzarre gains a stacking strength buff for each enemy he defeats."],["Herculean","At high stacks, his basic attacks have a chance to stun."],["Immortal","Stacks no longer reset between waves."]],"a":"All Fire allies gain increased critical hit chance."},{"n":"Ripple","e":"Water","r":"Ranger","s":1,"t":"The Bugler","b":"A bespectacled sea scout with a golden bugle. One blast sends a wave that knocks enemies right off their feet.","img":"img/ripple.webp?v=2","k":[["Current","Basic attacks have a chance to knock the target back slightly."],["Undertow","Knocked-back enemies take bonus damage from the hit that pushed them."],["Riptide","Ripple's attack range and knockback chance both increase."]],"a":"All Water allies gain increased hit chance."},{"n":"Sable","e":"Dark","r":"Ranger","s":2,"t":"The Cat Burglar","b":"A sly jewel thief who works by moonlight. She strikes hard from the shadows with razor-edged cards, then slips away from the counterattack.","img":"img/sable.webp","k":[["Night Strike","Basic attacks against enemies above 70% HP deal bonus damage."],["Shadow Step","Sable has a chance to evade incoming attacks."],["Eclipse","After evading, Sable's next attack always deals bonus damage."]],"a":"All Dark allies gain increased attack speed."},{"n":"Scamper","e":"Earth","r":"Ranger","s":3,"t":"The Forest Scout","b":"A hyperactive scout who never stops moving. His reed blowgun fires fast and he's almost impossible to hit.","img":"img/scamper.webp","k":[["Quick Feet","Scamper's attack speed is slightly increased."],["Skitter","Scamper has a small chance to evade incoming attacks."],["Dash","Attack speed bonus increases further."]],"a":"All Earth allies gain increased armor."},{"n":"Sir Rat-a-lot","e":"Fire","r":"Guardian","s":4,"t":"The Gallant Knight","b":"Chivalrous, brave and a little vain about his armour. He leaps in front of the most wounded ally and grows stronger when he saves them.","img":"img/sir_rat-a-lot.webp","k":[["Chivalry","Sir Rat-a-lot taunts the enemy attacking the lowest-HP ally."],["Noble Stand","While taunting, damage taken is reduced."],["Knighted","Successfully protecting an ally grants a temporary damage buff."]],"a":"All Fire allies gain increased ,"s":1,"t":"The Void Gunner","b":"A moody gunner whose cannon crackles with dark energy. Her shots stack up on enemies until they burst.","img":"img/umbra.webp?v=2","k":[["Void Shot","Basic attacks apply a stacking debuff that increases damage taken."],["Consuming Dark","When the debuff reaches maximum stacks, it explodes, dealing area damage and refreshing itself."],["Starless Night","Umbra's own damage increases for each unique enemy carrying the debuff."]],"a":"All Dark allies gain increased attack speed."},{"n":"Vincent Van Gnaw","e":"Light","r":"Artillerist","s":5,"t":"The Starry Painter","b":"A passionate artist lost in colour and starlight. His paint-tube cannon splashes swirling Starry Night zones that keep hurting enemies.","img":"img/vincent_van_gnaw.webp","k":[["Starry Shot","Basic attacks leave a lingering zone that deals damage over time."],["Brushstroke","Standing in his own zone grants Vincent bonus attack speed."],["Masterpiece","Zones deal increased damage the longer they've existed."]],"a":"All Light allies take reduced damage while below 50% HP."}];
const EL = {Fire:"var(--fire)",Water:"var(--water)",Earth:"var(--earth)",Light:"var(--light)",Dark:"var(--dark)"};
const ROLES = ["Guardian","Ranger","Artillerist","Bard"];
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let fEl="All", fRo="All";

function chip(row,label,color){
  const b=document.createElement("button");b.className="chip";b.type="button";
  b.innerHTML=(color?`<span class="dot" style="--c:${color}"></span>`:"")+esc(label);
  b.dataset.v=label;row.appendChild(b);
}
const elRow=document.getElementById("elRow"),roRow=document.getElementById("roRow");
chip(elRow,"All",null);["Fire","Water","Earth","Light","Dark"].forEach(e=>chip(elRow,e,EL[e]));
chip(roRow,"All",null);ROLES.forEach(r=>chip(roRow,r,null));
elRow.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{fEl=b.dataset.v;render()}));
roRow.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{fRo=b.dataset.v;render()}));

const grid=document.getElementById("grid");
RATS.forEach((r,i)=>{
  const b=document.createElement("button");b.type="button";b.className="panel card";b.dataset.i=i;
  b.style.setProperty("--c",EL[r.e]);
  b.setAttribute("aria-label",`${r.n}, ${r.e} ${r.r}, ${r.s} star. Open details`);
  b.innerHTML=`<div class="portrait"><span class="elem" title="${r.e}"></span><img src="${r.img}" alt="" loading="lazy" decoding="async"><span class="stars">${"★".repeat(r.s)}</span></div><div class="plate">${esc(r.n)}</div>`;
  b.addEventListener("click",()=>open(i));
  grid.appendChild(b);
});

function render(){
  let n=0;
  grid.querySelectorAll(".card").forEach(c=>{
    const r=RATS[c.dataset.i];const ok=(fEl==="All"||r.e===fEl)&&(fRo==="All"||r.r===fRo);
    c.hidden=!ok;if(ok)n++;
  });
  elRow.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fEl));
  roRow.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fRo));
  document.getElementById("count").textContent=`Showing ${n} of ${RATS.length} rats`;
  document.getElementById("empty").hidden=n>0;
}

const dlg=document.getElementById("dlg");
function open(i,fromHash){
  const r=RATS[i];
  document.getElementById("dPortrait").style.setProperty("--c",EL[r.e]);
  const im=document.getElementById("dImg");im.src=r.img;im.alt=r.n;
  document.getElementById("dName").textContent=r.n;
  document.getElementById("dTitle").textContent=r.t;
  document.getElementById("dBadges").innerHTML=
    `<span class="badge"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${EL[r.e]}"></span>${r.e}</span>`+
    `<span class="badge">${r.r}</span><span class="badge star">${"★".repeat(r.s)}</span>`;
  document.getElementById("dBio").textContent=r.b;
  const lv=["Lv 1","Lv 51","Lv 101"];
  document.getElementById("dSkills").innerHTML=r.k.map((k,j)=>`<li><span class="lv">${lv[j]}</span><span class="sk">${esc(k[0])}</span><span class="sd">${esc(k[1])}</span></li>`).join("")+
    `<li><span class="lv aura">Lv 75</span><span class="sk">Leader Aura</span><span class="sd">${esc(r.a)} Active while in the leader slot.</span></li>`;
  if(!dlg.open){try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}}
  dlg.querySelector(".sheet").scrollTop=0;
  if(!fromHash){try{history.replaceState(null,"","#"+slug(r.n))}catch(e){location.hash=slug(r.n)}}
}
function close(){dlg.close()}
dlg.addEventListener("close",()=>{if(location.hash){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}});
document.getElementById("closeBtn").addEventListener("click",close);
dlg.addEventListener("click",e=>{if(e.target===dlg)close()});
function fromHash(){const h=location.hash.slice(1);if(!h)return;const i=RATS.findIndex(r=>slug(r.n)===h);if(i>=0)open(i,true)}
window.addEventListener("hashchange",fromHash);
render();fromHash();
</script>
