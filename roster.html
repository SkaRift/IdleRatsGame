<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Meet all 55 rats of Idle Rats, the idle auto-battler by SkaRift.">
<link rel="stylesheet" href="site.css?v=6">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#10244a">
<title>Idle Rats Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">


</head>
<body>
<div class="wrap">
  <nav class="panel nav" aria-label="Site">
    <div class="links">
      <a href="./">Home</a>
      <a href="roster.html" aria-current="page">Roster</a>
      <div class="dd">
        <button type="button" id="communityBtn" aria-haspopup="true" aria-expanded="false" aria-controls="communityMenu">Community <span class="caret" aria-hidden="true">▾</span></button>
        <div class="ddmenu panel" id="communityMenu" role="menu" hidden></div>
      </div>
    </div>
  </nav>
  <a class="toplogo" href="./"><img src="img/logo.webp" alt="Idle Rats" width="640" height="479"></a>
  <header>
    <h1 class="gamelogo"><span class="sub">Roster</span></h1>
    <p class="tag">All 55 recruits from the sewers. Tap a rat to read their file.</p>
  </header>

  <section class="panel filters" aria-label="Filter the roster">
    <div class="row" id="elRow"><span class="lbl">Element</span></div>
    <div class="row" id="roRow"><span class="lbl">Role</span></div>
    <div class="row" id="stRow"><span class="lbl">Stars</span></div>
  </section>
  <p class="count" id="count" aria-live="polite"></p>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>No rats match those filters. Tap "All" to see everyone.</p>

  <p class="count" style="margin-top:18px">Star ratings show each rat's starting rank.</p>
  <footer class="foot"><span>Idle Rats © 2026 SkaRift</span><a href="./">Home</a><a href="roster.html">Roster</a><a href="https://skarift.github.io/idlerats-legal/">Privacy Policy</a></footer>
</div>

<dialog id="dlg" aria-labelledby="dName">
  <div class="panel sheet">
    <button class="close" id="closeBtn" aria-label="Close">✕</button>
    <div class="top">
      <div class="portrait" id="dPortrait"><span class="elem"></span><img class="ped" id="dPed" alt="" aria-hidden="true"><img id="dImg" alt=""></div>
      <div>
        <h2 class="dname" id="dName"></h2>
        <p class="dtitle" id="dTitle"></p>
        <div class="badges" id="dBadges"></div>
      </div>
    </div>
    <p class="bio" id="dBio"></p>
    <div>
      <h3 class="sec">Skills</h3>
      <ul class="skills" id="dSkills"></ul>
    </div>
  </div>
</dialog>

<script src="rats.js?v=3"></script>
<script>
const EL = {Fire:"var(--fire)",Water:"var(--water)",Earth:"var(--earth)",Light:"var(--light)",Dark:"var(--dark)"};
const ROLES = ["Guardian","Ranger","Artillerist","Bard"];
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let fEl="All", fRo="All", fSt="All";

function chip(row,label,color){
  const b=document.createElement("button");b.className="chip";b.type="button";
  b.innerHTML=(color?`<span class="dot" style="--c:${color}"></span>`:"")+esc(label);
  b.dataset.v=label;row.appendChild(b);
}
const elRow=document.getElementById("elRow"),roRow=document.getElementById("roRow"),stRow=document.getElementById("stRow");
chip(elRow,"All",null);["Fire","Water","Earth","Light","Dark"].forEach(e=>chip(elRow,e,EL[e]));
chip(roRow,"All",null);ROLES.forEach(r=>chip(roRow,r,null));
// Starting rank: chip value is the number, label shows the stars.
chip(stRow,"All",null);[1,2,3,4,5].forEach(s=>{chip(stRow,s+"★",null);stRow.lastChild.dataset.v=String(s)});
elRow.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{fEl=b.dataset.v;render()}));
roRow.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{fRo=b.dataset.v;render()}));
stRow.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{fSt=b.dataset.v;render()}));

const grid=document.getElementById("grid");
RATS.forEach((r,i)=>{
  const b=document.createElement("button");b.type="button";b.className="panel card";b.dataset.i=i;
  b.style.setProperty("--c",EL[r.e]);
  b.setAttribute("aria-label",`${r.n}, ${r.e} ${r.r}, ${r.s} star. Open details`);
  b.innerHTML=`<div class="portrait"><span class="elem" title="${r.e}"></span><img src="${r.img}" alt="" loading="lazy" decoding="async"><span class="stars">${"★".repeat(r.s)}</span></div><div class="plate">${esc(r.n)}</div>`;
  b.addEventListener("click",()=>open(i));
  grid.appendChild(b);
});

function render(){
  let n=0;
  grid.querySelectorAll(".card").forEach(c=>{
    const r=RATS[c.dataset.i];const ok=(fEl==="All"||r.e===fEl)&&(fRo==="All"||r.r===fRo)&&(fSt==="All"||String(r.s)===fSt);
    c.hidden=!ok;if(ok)n++;
  });
  elRow.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fEl));
  roRow.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fRo));
  stRow.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fSt));
  document.getElementById("count").textContent=`Showing ${n} of ${RATS.length} rats`;
  document.getElementById("empty").hidden=n>0;
}

const dlg=document.getElementById("dlg");
// Stand the rat on its lid: measure the art's visible pixels, scale it to fit
// (keeping aspect), centre it on the lid by its visual weight, and let it pop
// a little above the frame. Falls back to the plain CSS fit if measuring fails.
const fitCache={};
function measure(src){
  return new Promise(res=>{
    if(fitCache[src]) return res(fitCache[src]);
    const t=new Image();
    t.onload=()=>{
      try{
        const N=180,c=document.createElement("canvas");c.width=c.height=N;
        const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(t,0,0,N,N);
        const d=x.getImageData(0,0,N,N).data;
        let x0=N,x1=-1,y0=N,y1=-1,m=0,mx=0;
        for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const a=d[(y*N+xx)*4+3];if(a>40){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y;m+=a;mx+=a*xx}}
        if(x1<0) return res(null);
        // Width for scaling ignores thin extremes (tails, wisps): trim columns with little ink.
        const col=new Array(N).fill(0);
        for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const a=d[(y*N+xx)*4+3];if(a>40)col[xx]+=a}
        const cm=Math.max(...col);let tx0=x0,tx1=x1;
        while(tx0<tx1&&col[tx0]<cm*0.12)tx0++;
        while(tx1>tx0&&col[tx1]<cm*0.12)tx1--;
        res(fitCache[src]={x0:tx0/N,x1:(tx1+1)/N,y0:y0/N,y1:(y1+1)/N,cx:mx/m/N+0.5/N});
      }catch(e){res(null)}
    };
    t.onerror=()=>res(null);
    t.src=src;
  });
}
async function fitRat(im,src){
  im.removeAttribute("style");im.style.visibility="hidden";im.src=src;
  const b=await measure(src);
  if(im.getAttribute("src")!==src){return}
  if(b){
    const FEET=0.9, MAXH=0.96, MAXW=0.8;           // fractions of the frame
    const bw=Math.max(b.cx-b.x0,b.x1-b.cx)*2, bh=b.y1-b.y0;
    const sc=Math.min(MAXW/bw, MAXH/bh);            // frame-widths per source-width
    im.style.cssText=`left:${(0.5-b.cx*sc)*100}%;top:${(FEET-b.y1*sc)*100}%;width:${sc*100}%;height:${sc*100}%`;
  }
  im.style.visibility="visible";
}
function open(i,fromHash){
  const r=RATS[i];
  document.getElementById("dPortrait").style.setProperty("--c",EL[r.e]);
  const im=document.getElementById("dImg");im.alt=r.n;fitRat(im,r.img);
  document.getElementById("dPed").src="img/ped_"+r.e.toLowerCase()+".webp";
  document.getElementById("dName").textContent=r.n;
  document.getElementById("dTitle").textContent=r.t;
  document.getElementById("dBadges").innerHTML=
    `<span class="badge"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${EL[r.e]}"></span>${r.e}</span>`+
    `<span class="badge">${r.r}</span><span class="badge star">${"★".repeat(r.s)}</span>`;
  document.getElementById("dBio").textContent=r.b;
  const lv=["Lv 1","Lv 51","Lv 101"];
  document.getElementById("dSkills").innerHTML=r.k.map((k,j)=>`<li><span class="lv">${lv[j]}</span><span class="sk">${esc(k[0])}</span><span class="sd">${esc(k[1])}</span></li>`).join("")+
    `<li><span class="lv aura">Lv 75</span><span class="sk">Leader Aura</span><span class="sd">${esc(r.a)}</span></li>`;
  if(!dlg.open){try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}}
  dlg.querySelector(".sheet").scrollTop=0;
  if(!fromHash){try{history.replaceState(null,"","#"+slug(r.n))}catch(e){location.hash=slug(r.n)}}
}
function close(){dlg.close()}
dlg.addEventListener("close",()=>{if(location.hash){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}});
document.getElementById("closeBtn").addEventListener("click",close);
dlg.addEventListener("click",e=>{if(e.target===dlg)close()});
function fromHash(){const h=location.hash.slice(1);if(!h)return;const i=RATS.findIndex(r=>slug(r.n)===h);if(i>=0)open(i,true)}
window.addEventListener("hashchange",fromHash);
render();fromHash();
</script>

<script src="site.js?v=10"></script>
</body>
</html>
